    // ============== TAX YEAR EXPORT ==============
    // Year-end deliverable for Schedule C: gross receipts (line 1), booking count,
    // by-service + by-month breakdown, deposits reconciliation, holiday-rate flag.
    // Output: an on-screen summary mom can screenshot + a full-year CSV file
    // Homen can drop into tax prep software.
    function bookingYearOverlap(b, year) {
      const yStart = Date.UTC(year, 0, 1);
      const yEnd = Date.UTC(year, 11, 31, 23, 59, 59, 999);
      return b.startMs <= yEnd && b.endMs >= yStart;
    }

    function computeYearSummary(year) {
      const all = confirmedBookings.filter((b) => b.status !== 'cancelled' && bookingYearOverlap(b, year));
      const confirmed = all.filter((b) => b.status === 'confirmed');
      const priced = confirmed.filter((b) => Number.isFinite(b.priceTotal));
      const gross = priced.reduce((s, b) => s + b.priceTotal, 0);
      const missingPrice = confirmed.length - priced.length;
      const depositCount = confirmed.filter((b) => b.depositPaid).length;
      const serviceLabel = (s) => ({ boarding: '过夜寄养', daycare: '日托', walk: '遛狗', dropin: '上门探望', other: '其他' }[s] || s);

      // By service
      const byService = {};
      for (const b of priced) {
        const s = b.service || 'other';
        byService[s] = byService[s] || { count: 0, sum: 0 };
        byService[s].count++;
        byService[s].sum += b.priceTotal;
      }

      // By month (12 rows, always)
      const byMonth = new Array(12).fill(null).map(() => ({ count: 0, sum: 0, unpriced: 0 }));
      for (const b of confirmed) {
        // Attribute each booking to its start-month (cash-basis-ish, matches iCal rendering).
        const mi = new Date(b.startMs).getUTCMonth();
        byMonth[mi].count++;
        if (Number.isFinite(b.priceTotal)) byMonth[mi].sum += b.priceTotal;
        else byMonth[mi].unpriced++;
      }

      // Holiday-rate flagging: start-date falls on a known high-surcharge day.
      const holidayDates = holidayDatesFor(year);
      const holidayBookings = confirmed.filter((b) => {
        const start = new Date(b.startMs).toISOString().slice(0, 10);
        const end = new Date(b.endMs).toISOString().slice(0, 10);
        return holidayDates.some((h) => h >= start && h <= end);
      });

      // Average + median (on priced only).
      const prices = priced.map((b) => b.priceTotal).sort((a, b) => a - b);
      const avg = prices.length ? Math.round(gross / prices.length) : 0;
      const median = prices.length
        ? (prices.length % 2
            ? prices[(prices.length - 1) / 2]
            : Math.round((prices[prices.length / 2 - 1] + prices[prices.length / 2]) / 2))
        : 0;

      return { year, gross, confirmed, priced, missingPrice, depositCount, byService, byMonth, holidayBookings, avg, median, serviceLabel };
    }

    function holidayDatesFor(year) {
      // Matches operations/03_pricing_and_payment.md: Thanksgiving, Christmas Eve/Day,
      // New Year's Eve/Day, July 4. Simple mapping — Thanksgiving handled via lookup.
      const tg = { 2024: '2024-11-28', 2025: '2025-11-27', 2026: '2026-11-26', 2027: '2027-11-25', 2028: '2028-11-23' };
      return [
        `${year}-01-01`, `${year}-07-04`, `${year}-12-24`, `${year}-12-25`, `${year}-12-31`,
        tg[year] || `${year}-11-25`,
      ];
    }

    function downloadYearCsv(year) {
      const S = computeYearSummary(year);
      const rows = S.confirmed.slice().sort((a, b) => a.startMs - b.startMs);
      const esc = (v) => {
        const s = v == null ? '' : String(v);
        return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      };
      const header = ['start_date', 'end_date', 'customer_name', 'customer_contact', 'dog_name', 'service', 'status', 'price_usd', 'deposit_paid', 'notes', 'created_from'];
      const lines = [header.join(',')];
      for (const b of rows) {
        lines.push([
          new Date(b.startMs).toISOString().slice(0, 10),
          new Date(b.endMs).toISOString().slice(0, 10),
          esc(b.customerName),
          esc(b.customerContact),
          esc(b.dogName || ''),
          esc(b.service || ''),
          esc(b.status),
          Number.isFinite(b.priceTotal) ? b.priceTotal : '',
          b.depositPaid ? 'Y' : '',
          esc(b.notes || ''),
          esc(b.createdFrom || ''),
        ].join(','));
      }
      // Aggregate section at the end — commented column for Schedule C mapping.
      lines.push('');
      lines.push(`# AGGREGATE ${year} — generated ${new Date().toISOString()}`);
      lines.push(`# Gross receipts (Schedule C Part I Line 1),${S.gross}`);
      lines.push(`# Confirmed bookings,${S.confirmed.length}`);
      lines.push(`# Priced bookings,${S.priced.length}`);
      lines.push(`# Missing price (income likely understated),${S.missingPrice}`);
      lines.push(`# Deposits received,${S.depositCount}`);
      lines.push(`# Average booking (priced only),${S.avg}`);
      lines.push(`# Median booking (priced only),${S.median}`);
      lines.push(`# Holiday-rate bookings (review +50% surcharge),${S.holidayBookings.length}`);
      lines.push('');
      lines.push('# By-service breakdown:');
      for (const [svc, v] of Object.entries(S.byService)) {
        lines.push(`# ${S.serviceLabel(svc)} (${svc}),${v.sum},${v.count}`);
      }
      lines.push('');
      lines.push('# By-month breakdown:');
      const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      for (let i = 0; i < 12; i++) {
        lines.push(`# ${monthNames[i]} ${year},${S.byMonth[i].sum},${S.byMonth[i].count}`);
      }

      const csv = '\uFEFF' + lines.join('\r\n') + '\r\n';
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `pawpaw-bookings-${year}-YEAR-schedule-c.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      addAgentMessage(`已导出 ${year} 全年 ${rows.length} 条预订到 CSV（含 Schedule C 汇总）。`);
    }

    function downloadBookingsCsv(year, month) {
      const rows = confirmedBookings
        .filter((b) => bookingIntersectsMonth(b, year, month))
        .slice()
        .sort((a, b) => a.startMs - b.startMs);

      const header = ['start_date', 'end_date', 'customer_name', 'customer_contact', 'dog_name', 'service', 'status', 'price_usd', 'deposit_paid', 'notes', 'created_from'];
      const esc = (v) => {
        const s = v == null ? '' : String(v);
        return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      };
      const lines = [header.join(',')];
      for (const b of rows) {
        lines.push([
          new Date(b.startMs).toISOString().slice(0, 10),
          new Date(b.endMs).toISOString().slice(0, 10),
          esc(b.customerName),
          esc(b.customerContact),
          esc(b.dogName || ''),
          esc(b.service || ''),
          esc(b.status),
          Number.isFinite(b.priceTotal) ? b.priceTotal : '',
          b.depositPaid ? 'Y' : '',
          esc(b.notes || ''),
          esc(b.createdFrom || ''),
        ].join(','));
      }
      // BOM so Excel opens UTF-8 properly.
      const csv = '\uFEFF' + lines.join('\r\n') + '\r\n';
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const yyyymm = `${year}-${String(month + 1).padStart(2, '0')}`;
      a.href = url;
      a.download = `pawpaw-bookings-${yyyymm}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      addAgentMessage(`已导出 ${rows.length} 条预订到 CSV（${yyyymm}）。`);
    }

    async function cancelBooking(bookingId) {
      if (!confirm('确定取消这个预订？客户的日期会重新显示为未确认询问。')) return;
      try {
        const res = await fetch('/api/bookings?action=cancel', {
          method: 'POST',
          headers: { 'content-type': 'application/json', 'x-api-key': apiKey },
          body: JSON.stringify({ bookingId }),
        });
        const body = await res.json().catch(() => ({}));
        if (!res.ok || !body.ok) throw new Error(body.error || `HTTP ${res.status}`);
        addAgentMessage('预订已取消。');
        await refreshData();
        renderCalendar();
      } catch (err) {
        alert('取消失败: ' + err.message);
      }
    }

    function showCalendarDay(key) {
      const panel = document.getElementById('cal-day-panel');
      if (!panel) return;
      const dayInquiries = inquiries.filter((i) => {
        const d = new Date(i.timestamp || 0);
        return d.toISOString().slice(0, 10) === key;
      });
      const [y, m, d] = key.split('-');
      // UTC boundaries — must match how startMs/endMs are stored.
      const dayStart = Date.UTC(+y, +m - 1, +d);
      const dayEnd = dayStart + 86_399_999;
      const promotedIds = new Set(confirmedBookings.filter((b) => !isPersonalBlock(b)).map((b) => String(b.inquiryId || '')));
      const dayAll = confirmedBookings.filter((b) => b.status !== 'cancelled' && b.startMs <= dayEnd && b.endMs >= dayStart);
      const dayCustomer = dayAll.filter((b) => !isPersonalBlock(b));
      const dayPersonal = dayAll.filter((b) => isPersonalBlock(b));
      const dayExternal = externalBlocks.filter((ev) => ev.startMs <= dayEnd && ev.endMs >= dayStart);
      const bookings = inquiries
        .filter((i) => !promotedIds.has(String(i._id || i.id || '')))
        .filter((i) => parseDatesInMonth(i.dates || '', +y, +m - 1).includes(key));

      let html = `<h4>${y}年${+m}月${+d}日</h4>`;
      if (dayInquiries.length === 0 && bookings.length === 0 && dayCustomer.length === 0 && dayPersonal.length === 0 && dayExternal.length === 0) {
        html += `<p style="color:var(--text-secondary);font-size:13px">这一天没有咨询或预订</p>`;
        html += `<button onclick="openPersonalBlockModal('${key}')" style="margin-top:10px;background:#f3f4f6;border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:12px;color:var(--text-primary);cursor:pointer">🚫 标记这天为休息日</button>`;
      } else {
        if (dayCustomer.length) {
          const hasOverlap = dayCustomer.length + bookings.length >= 2 || (dayCustomer.length >= 1 && (dayPersonal.length + dayExternal.length) >= 1);
          html += `<div style="font-size:12px;color:var(--text-secondary);margin:8px 0 4px">✅ 已确认预订${hasOverlap ? ' <span style="color:#92400e;font-weight:600">⚠️ 同日还有其他安排</span>' : ''}</div>`;
          for (const b of dayCustomer) {
            const range = new Date(b.startMs).toISOString().slice(5,10).replace('-','/') + '–' + new Date(b.endMs).toISOString().slice(5,10).replace('-','/');
            const tag = `<span class="tag replied">${b.status === 'tentative' ? '暂定' : '已确认'}</span>`;
            const price = b.priceTotal != null ? ` <span style="color:#16a34a;font-weight:600">$${b.priceTotal}</span>` : '';
            const deposit = b.depositPaid ? ' <span style="color:#16a34a;font-size:10px">·定金✓</span>' : '';
            const shareBtn = `<button onclick="shareStayLink('${b._id || b.id}')" style="background:none;border:0;color:#16a34a;cursor:pointer;font-size:11px;margin-left:6px" title="分享纪念页给客户 / 家人">📤 纪念页</button>`;
            const editBtn = `<button onclick='openBookingModal({mode:"edit", bookingId:"${b._id || b.id}"})' style="background:none;border:0;color:#2563eb;cursor:pointer;font-size:11px;margin-left:6px">编辑</button>`;
            const cancelBtn = `<button onclick="cancelBooking('${b._id || b.id}')" style="background:none;border:0;color:#b5381b;cursor:pointer;font-size:11px;margin-left:6px">取消</button>`;
            html += `<div class="cal-day-item"><span class="name">${escapeHtml(b.customerName)} · ${escapeHtml(b.dogName || '')} · ${range}${price}${deposit}</span>${tag}${shareBtn}${editBtn}${cancelBtn}</div>`;
          }
        }
        if (dayPersonal.length) {
          html += `<div style="font-size:12px;color:var(--text-secondary);margin:12px 0 4px">🚫 个人休息日</div>`;
          for (const b of dayPersonal) {
            const range = new Date(b.startMs).toISOString().slice(5,10).replace('-','/') + '–' + new Date(b.endMs).toISOString().slice(5,10).replace('-','/');
            const cancelBtn = `<button onclick="cancelBooking('${b._id || b.id}')" style="background:none;border:0;color:#b5381b;cursor:pointer;font-size:11px;margin-left:6px">取消休息</button>`;
            html += `<div class="cal-day-item" style="background:#f9fafb"><span class="name" style="color:#6b7280">🚫 ${range}${b.notes ? ' · ' + escapeHtml(b.notes) : ''}</span>${cancelBtn}</div>`;
          }
        }
        if (dayExternal.length) {
          html += `<div style="font-size:12px;color:var(--text-secondary);margin:12px 0 4px">📅 个人日历事件</div>`;
          for (const ev of dayExternal) {
            html += `<div class="cal-day-item" style="background:#fafafa"><span class="name" style="color:#6b7280">📅 ${escapeHtml(ev.summary || '(无标题)')}</span><span class="tag" style="background:#e5e7eb;color:#374151">来自 Google</span></div>`;
          }
        }
        if (dayInquiries.length) {
          html += '<div style="font-size:12px;color:var(--text-secondary);margin:12px 0 4px">📥 当天的咨询</div>';
          for (const i of dayInquiries) {
            const tag = i.replied ? '<span class="tag replied">已回复</span>' : '<span class="tag new">待回复</span>';
            html += `<div class="cal-day-item"><span class="name">${escapeHtml(i.name)} · ${escapeHtml(i.dog || '')}</span>${tag}</div>`;
          }
        }
        if (bookings.length) {
          const isConflict = bookings.length + dayConfirmed.length >= 2;
          html += `<div style="font-size:12px;color:var(--text-secondary);margin:12px 0 4px">📅 未确认的询问${isConflict ? ' <span style="color:#92400e;font-weight:600">⚠️ 有冲突</span>' : ''}</div>`;
          if (isConflict) {
            html += '<div style="background:#fff8e6;border-left:3px solid #d97706;padding:8px 10px;margin-bottom:6px;font-size:12px;color:#92400e;border-radius:4px">这一天有多个预订请求 — 确认前请致电客户核实档期。</div>';
          }
          for (const i of bookings) {
            const id = i._id || i.id;
            const promoteBtn = `<button class="promote-btn" onclick="openPromoteModal('${id}')" title="确认这条询问为正式预订">✅ 确认为预订</button>`;
            html += `<div class="cal-day-item ${isConflict ? 'conflict' : ''}"><span class="name">${escapeHtml(i.name)} · ${escapeHtml(i.dates || '')}</span><span class="tag ${isConflict ? 'conflict' : 'booking'}">${isConflict ? '冲突' : '询问'}</span>${promoteBtn}</div>`;
          }
        }
      }
      panel.innerHTML = html;
      panel.classList.add('open');
    }

    // Parse free-text `dates` field and return YYYY-MM-DD keys that fall within the given month.
    // Handles common patterns: "7/15", "July 15", "July 15-20", "7月15日", "12/1-12/5".
    function parseDatesInMonth(text, year, month) {
      if (!text) return [];
      const keys = new Set();
      const monthMap = { jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11 };

      const addRange = (m, startDay, endDay) => {
        if (m !== month) return;
        const last = new Date(year, month + 1, 0).getDate();
        for (let d = Math.max(1, startDay); d <= Math.min(last, endDay || startDay); d++) {
          keys.add(new Date(year, month, d).toISOString().slice(0, 10));
        }
      };

      // Numeric: M/D or M/D-D or M/D-M/D
      const numeric = text.matchAll(/(\d{1,2})\/(\d{1,2})(?:\s*[-–]\s*(?:(\d{1,2})\/)?(\d{1,2}))?/g);
      for (const m of numeric) {
        const m1 = +m[1] - 1;
        const d1 = +m[2];
        const m2 = m[3] ? +m[3] - 1 : m1;
        const d2 = m[4] ? +m[4] : d1;
        if (m1 === m2) addRange(m1, d1, d2);
        else { addRange(m1, d1, 31); addRange(m2, 1, d2); }
      }
      // English month name
      const english = text.toLowerCase().matchAll(/(jan|feb|mar|apr|may|jun|jul|aug|sept?|oct|nov|dec)[a-z]*\s+(\d{1,2})(?:\s*[-–]\s*(\d{1,2}))?/g);
      for (const m of english) {
        const mi = monthMap[m[1]];
        if (mi == null) continue;
        addRange(mi, +m[2], m[3] ? +m[3] : +m[2]);
      }
      // Chinese: M月D日 or M月D-D日
      const chinese = text.matchAll(/(\d{1,2})月(\d{1,2})(?:\s*[-–~至到]\s*(\d{1,2}))?日?/g);
      for (const m of chinese) {
        const mi = +m[1] - 1;
        addRange(mi, +m[2], m[3] ? +m[3] : +m[2]);
      }
      return [...keys];
    }

    function markAllRead() {
      addAgentMessage('已将所有咨询标记为已读。');
    }
    
    // Language flag emoji for an inquiry. Prefer detectedLang (ground truth from the
    // translation step) over the form's lang hint (which is just 'en' or 'zh' from the
    // landing page they happened to use).
    function langFlag(i) {
      // Prefer detectedLang (when it persists); fall back to `lang` which we now
      // overload with the detection result server-side as a workaround for the
      // optional-field-drop issue. Still fall back to 'en' as last resort.
      const code = String(i.detectedLang || i.lang || 'en').toLowerCase();
      const map = {
        zh: '🇨🇳', en: '🇺🇸', es: '🇪🇸', vi: '🇻🇳', tl: '🇵🇭', ko: '🇰🇷', ja: '🇯🇵',
        hi: '🇮🇳', fr: '🇫🇷', de: '🇩🇪', ru: '🇷🇺', pt: '🇵🇹', ar: '🌍',
      };
      return map[code] || '🌐';
    }

    function langName(code) {
      return {
        zh: '中文', en: 'English', es: 'Español', vi: 'Tiếng Việt', tl: 'Tagalog',
        ko: '한국어', ja: '日本語', hi: 'हिन्दी', ar: 'العربية', fr: 'Français',
        de: 'Deutsch', ru: 'Русский', pt: 'Português',
      }[String(code || '').toLowerCase()] || code || '?';
    }

    // Resolve utm_source from an inquiry — prefer the dedicated field, fall back
    // to parsing page_url query params (covers cases where the server-side write
    // path stripped the optional field but preserved page_url).
    function resolveUtmSource(i) {
      if (i.utm_source) return i.utm_source;
      if (i.page_url) {
        try {
          const u = new URL(i.page_url);
          const s = u.searchParams.get('utm_source') || u.searchParams.get('ref');
          if (s) return s.slice(0, 40);
        } catch { /* malformed url — ignore */ }
      }
      return null;
    }

    // Pick an emoji that visually codes the attribution source so mom can scan
    // the inbox and see "oh, 3 of these came from WeChat this week".
    function sourceEmoji(src) {
      const s = String(src || '').toLowerCase();
      if (/wechat|weixin|moments|朋友圈/.test(s)) return '💬';
      if (/nextdoor/.test(s)) return '🏘️';
      if (/facebook|fb|instagram|ig/.test(s)) return '📘';
      if (/flyer|print|poster/.test(s)) return '🖨️';
      if (/google|gbp|gmb|search/.test(s)) return '🔍';
      if (/yelp/.test(s)) return '⭐';
      if (/referral|referrer|friend/.test(s)) return '🤝';
      return '🏷️';
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    
    function formatTime(ts) {
      const d = new Date(ts);
      const now = new Date();
      const diff = (now - d) / 1000;
      
      if (diff < 60) return '刚刚';
      if (diff < 3600) return Math.floor(diff / 60) + '分钟前';
      if (diff < 86400) return Math.floor(diff / 3600) + '小时前';
      return d.toLocaleDateString('zh-CN');
    }
    
    // Auto-resize textarea
    document.getElementById('chat-input')?.addEventListener('input', function() {
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 120) + 'px';
    });
    
    // Auto-refresh every 30 seconds (only when logged in AND key still present)
    let _refreshInterval = setInterval(() => {
      if (!apiKey) return; // paused after 401
      if (document.getElementById('app')?.classList.contains('logged-in')) {
        refreshData();
      }
    }, 30000);
  </script>
